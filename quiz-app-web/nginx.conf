# Unprivileged nginx: everything it writes lives under /tmp so the container
# can run as a non-root user with a read-only application directory.
worker_processes  1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile   on;
    gzip       on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Hashed build assets are immutable; the shell must never be cached or
        # a deploy leaves browsers pointing at a bundle that no longer exists.
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # Single-page app: unknown paths are client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
