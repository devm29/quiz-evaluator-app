[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "DJ",   # Django-specific checks
    "SIM",  # simplifications
    "RUF",
]
ignore = [
    "RUF012",  # Django class attributes are conventionally plain mutables
]

[tool.ruff.lint.per-file-ignores]
"quiz/tests/*" = ["B018"]
